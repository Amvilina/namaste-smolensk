server {
    listen 80;
    server_name namaste-smolensk.ru 212.119.42.209;
    return 301 https://namaste-smolensk.ru$request_uri;
}

server {
    listen 443 ssl;
    server_name namaste-smolensk.ru;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location = /worker {
        try_files /worker.html =404;
    }

    location = /admin {
        try_files /admin.html =404;
    }

    location ~ ^/(api/|login$|logout$) {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $upstream backend:8080;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 20m;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
