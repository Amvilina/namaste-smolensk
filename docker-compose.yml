services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: "8080"
      DATA_DIR: /data
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-}
      MAX_WEBHOOK_URL: https://namaste-smolensk.ru/api/max/webhook
      SES_MAX_BOT_TOKEN: ${SES_MAX_BOT_TOKEN:-}
      SES_MAX_WEBHOOK_SECRET: ${SES_MAX_WEBHOOK_SECRET:-}
      SES_MAX_ADMINS: ${SES_MAX_ADMINS:-}
      SES_MAX_WEBHOOK_URL: https://namaste-smolensk.ru/api/lead/ses/webhook
      PORTFOLIO_MAX_BOT_TOKEN: ${PORTFOLIO_MAX_BOT_TOKEN:-}
      PORTFOLIO_MAX_WEBHOOK_SECRET: ${PORTFOLIO_MAX_WEBHOOK_SECRET:-}
      PORTFOLIO_MAX_ADMINS: ${PORTFOLIO_MAX_ADMINS:-}
      PORTFOLIO_MAX_WEBHOOK_URL: https://namaste-smolensk.ru/api/lead/portfolio/webhook
    volumes:
      - namaste-data:/data
    expose:
      - "8080"
    restart: unless-stopped

  web:
    build: .
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  namaste-data:
