services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: "8080"
      DATA_DIR: /data
    volumes:
      - namaste-data:/data
    expose:
      - "8080"
    restart: unless-stopped

  web:
    build: .
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  namaste-data:
